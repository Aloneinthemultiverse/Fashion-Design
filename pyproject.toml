[project]
name = "fashion"
version = "0.1.0"
description = "AI-powered cross-cultural fashion recommendation system"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "structlog>=24.4",
    "pillow>=11.0",
]

[project.optional-dependencies]
# Split so P0/P1 work without pulling ~2GB of torch.
api = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "python-multipart>=0.0.17",
    "redis>=5.2",
    "rq>=2.0",
]
vision = [
    "google-genai>=0.8",
]
embed = [
    "torch>=2.5",
    "open-clip-torch>=2.29",
]
store = [
    "qdrant-client>=1.12",
]
ui = [
    "streamlit>=1.40",
]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "ruff>=0.8",
    "mypy>=1.13",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fashion"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF", "ANN"]
ignore = ["ANN401"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ANN"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
packages = ["fashion"]

[[tool.mypy.overrides]]
module = ["open_clip.*", "qdrant_client.*", "rq.*", "streamlit.*", "google.genai.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q --strict-markers"
markers = [
    "integration: requires external services (Qdrant, Redis, network)",
]
