name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - run: uv python install 3.12

      - name: Install
        run: uv sync --extra dev

      - name: Lint
        run: uv run ruff check .

      - name: Format
        run: uv run ruff format --check .

      - name: Types
        run: uv run mypy

      # No API key, no Docker, no network: the default providers are all fakes.
      # Integration tests that need real services are excluded by marker.
      - name: Tests
        run: uv run pytest -m "not integration" --cov=fashion --cov-report=term-missing
